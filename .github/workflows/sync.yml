name: Sync bill data

# Bill status changes are event-driven (a bill can move stage on any sitting
# day, not on a fixed schedule), so this syncs a few times a day rather than
# once nightly like a slower-moving macroeconomic dataset would need.
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Sync bill data
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scrape.py
